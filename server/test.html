      /**
       * 决策模型数据补全引擎
       * @param {Object} rawJson - LLM 返回的原始精简 JSON
       */
      function hydrateDecisionModel(rawJson) {
        const data = { ...rawJson }

        // 1. 权重归一化 (防止 LLM 算错总和)
        const weightSum = Object.values(data.weights).reduce((a, b) => a + b, 0)
        Object.keys(data.weights).forEach(key => {
          data.weights[key] = parseFloat(
            (data.weights[key] / weightSum).toFixed(2)
          )
        })

        // 2. 递归补全 Tree 结构 (step, id, 默认值)
        const hydrateNode = (node, level = 0) => {
          node.step = level
          node.value = node.value || Math.floor(Math.random() * 40) + 50 // 默认基准分
          if (node.children && node.children.length > 0) {
            node.children.forEach(child => hydrateNode(child, level + 1))
          } else {
            delete node.logic_payload // 强制执行约束：叶子节点无 payload
          }
        }
        hydrateNode(data.treeData)

        // 3. 补全 Paths (ID, 维度对齐)
        data.paths = data.paths.map((p, idx) => ({
          id: `path-${idx + 1}`,
          income: p.impact?.['收入'] || 50, // 自动映射或给默认值
          growth: p.impact?.['成长'] || 50,
          risk: p.impact?.['风险'] || 30,
          happiness: p.impact?.['幸福感'] || 70,
          ...p
        }))

        // 4. 精确计算 Score (加权求和)
        // 计算公式：Score = Σ (路径概率 * Σ(维度影响 * 维度权重))
        const calculatedScores = {}
        data.options.forEach(opt => {
          const relatedPaths = data.paths.filter(p => p.name.includes(opt))
          let expectedValue = 0

          relatedPaths.forEach(path => {
            let pathScore = 0
            Object.keys(data.weights).forEach(vName => {
              const impactValue = path.impact?.[vName] || 50
              pathScore += impactValue * data.weights[vName]
            })
            expectedValue += pathScore * path.probability
          })

          calculatedScores[opt] = Math.round(expectedValue || 60)
        })

        // 5. 同步 Score 到推荐列表并排序
        data.scores = calculatedScores
        data.recommendation.rank = data.recommendation.rank
          .map(r => ({
            ...r,
            score: calculatedScores[r.option] || 0
          }))
          .sort((a, b) => b.score - a.score)

        return data
      }
